<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출하 계획 대비 실적</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0efec;
  --text: #0b0b0b; --text-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6; --plan: #9ec5f4; --actual: #2a78d6;
  --good: #0ca30c; --good-text: #006300; --warn: #fab219; --warn-text: #8a5a00; --bad: #d03b3b; --bad-text: #b02a2a;
  --row-hover: #f3f2ee; --edit: #fffbe8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5; --plan: #1c5cab; --actual: #6da7ec;
    --good-text: #0ca30c; --warn-text: #fab219; --bad-text: #e66767; --row-hover: #222220; --edit: #2a2716;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #262624; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5; --plan: #1c5cab; --actual: #6da7ec;
  --good-text: #0ca30c; --warn-text: #fab219; --bad-text: #e66767; --row-hover: #222220; --edit: #2a2716;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
body.busy, body.busy * { cursor: progress !important; }
header { padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--text-2); font-size: 13px; }
header .spacer { flex: 1; }
button, select, input[type=search], input[type=text], input[type=password], input:not([type]) { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 5px 9px; }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); font-size: 12px; white-space: nowrap; }
.chip a { cursor: pointer; color: var(--bad-text); }
#userChip { cursor: pointer; }
.lock { font-size: 13px; color: var(--text-2); }
.lock.mine { color: var(--good-text); font-weight: 600; }
.lock.other { color: var(--bad-text); font-weight: 600; }
.lock.stale { color: var(--warn-text); }
main { padding: 14px 24px 60px; max-width: 1800px; margin: 0 auto; }
nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap: wrap; }
nav.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 13px; color: var(--text-2); }
nav.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
.tile .k { color: var(--text-2); font-size: 13px; }
.tile .v { font-size: 25px; font-weight: 600; margin-top: 2px; }
.tile .s { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
.card h2 { font-size: 15px; margin: 0 0 12px; }
.card h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12px; }
.card p { margin: 0 0 10px; color: var(--text-2); }
.card.err { color: var(--bad-text); }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.tbl-wrap { overflow: auto; max-height: 70vh; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: 12px; z-index: 1; }
thead tr:nth-child(2) th { top: 29px; }
td.l, th.l { text-align: left; }
td.wrap { white-space: normal; min-width: 150px; }
th.grp { border-left: 1px solid var(--axis); }
td.grp { border-left: 1px solid var(--grid); }
tbody tr:hover { background: var(--row-hover); }
tr.total td { font-weight: 600; background: var(--surface-2); }
tr.click { cursor: pointer; }
tr.off td { color: var(--muted); }
input.num { width: 74px; text-align: right; padding: 2px 6px; background: var(--edit); border: 1px solid var(--axis); border-radius: 4px; font: inherit; color: var(--text); }
input.reason { width: 260px; padding: 2px 6px; background: var(--edit); }
td input[type=text] { background: var(--edit); padding: 2px 6px; }
.muted { color: var(--muted); }
.st { font-weight: 600; }
.st.good { color: var(--good-text); } .st.warn { color: var(--warn-text); } .st.bad { color: var(--bad-text); }
.st.plan { color: var(--muted); font-weight: 400; }
.pa { color: var(--text-2); } .pa b { color: var(--text); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.toolbar label { color: var(--text-2); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis-label { fill: var(--muted); font-size: 11px; }
.chart .val-label { fill: var(--text-2); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12px; white-space: nowrap; display: none; z-index: 50; }
.tip b { display: block; margin-bottom: 2px; }
.pill { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--surface-2); color: var(--text-2); font-size: 11px; font-weight: 400; }
.hidden { display: none !important; }
.note { color: var(--muted); font-size: 12px; margin-top: 6px; display: block; }
.drops { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 8px; }
.drop { border: 2px dashed var(--axis); border-radius: 10px; padding: 12px; cursor: pointer; display: block; }
.drop:hover, .drop.over { border-color: var(--accent); }
.drop.over { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.drop small.last { display: block; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--grid, #8883); color: var(--muted); font-size: 11px; line-height: 1.4; word-break: break-all; }
.drop b { display: block; } .drop span { color: var(--muted); font-size: 12px; }
.drop input { display: none; }
.drop.off, .btnlike.off { opacity: .5; cursor: default; }
.btnlike { border: 1px solid var(--axis); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
.drop.one { text-align: center; padding: 22px 12px; }
.drop.one span { display: block; margin: 4px 0; }
.drop.one .btnlike { display: inline-block; margin: 8px 0; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 14px; font-weight: 600; padding: 7px 16px; }
.upmore { margin-top: 10px; } .upmore summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--good); box-shadow: 0 6px 24px rgba(0,0,0,.18); border-radius: 8px; padding: 10px 14px; z-index: 60; display: flex; gap: 12px; align-items: flex-start; max-width: min(760px, 92vw); }
.toast.err { border-left-color: var(--bad); color: var(--bad-text); }
.toast button { padding: 2px 8px; font-size: 12px; }
#alert { padding: 10px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--bad); border-left-width: 4px; color: var(--bad-text); font-size: 14px; margin-bottom: 12px; }
#alert a { cursor: pointer; display: inline-block; padding: 1px 0; }
#alert a:hover { text-decoration: underline; }
#warn { padding: 8px 12px; border-radius: 8px; background: var(--surface-2); color: var(--warn-text); font-size: 13px; margin-bottom: 12px; white-space: pre-line; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; }
.mbox { background: var(--surface); border-radius: 12px; padding: 18px 20px; max-width: 520px; width: 100%; max-height: 90vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.mbox.wide { max-width: 980px; }
.mbox h2 { font-size: 16px; margin: 0 0 8px; }
.mbtns { margin-top: 14px; margin-bottom: 0; justify-content: flex-end; }
.vlist { max-height: 60vh; overflow: auto; }
.vrow { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.vsrc { margin-bottom: 6px; }
.vopts label { display: block; padding: 2px 0; color: var(--text-2); cursor: pointer; }
.vopts label b { color: var(--text); }
#setup { max-width: 760px; margin: 60px auto; }
</style>
</head>
<body>
<section id="setup" class="card hidden">
  <h2 style="font-size:18px">처음 연결</h2>
  <div id="setupBody"></div>
  <p id="setupMsg" class="st bad"></p>
</section>

<div id="app" class="hidden">
  <header>
    <h1 id="appName">출하 계획 대비 실적</h1>
    <label class="meta">기준월 <select id="ymSel"></select></label>
    <span class="meta" id="store"></span>
    <span class="spacer"></span>
    <span id="lockArea" class="toolbar" style="margin:0"></span>
    <button id="btnRefresh" title="공용 폴더에서 최신 자료를 다시 읽습니다">↻ 새로고침</button>
    <span class="chip" id="userChip" title="눌러서 이름 변경"></span>
    <a href="사용설명서.html" target="_blank" rel="noopener"><button type="button" title="사용설명서를 새 창으로 엽니다">도움말</button></a>
  </header>
  <main>
    <div id="alert" class="hidden"></div>
    <div id="warn" class="hidden"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="filters" id="filters">
      <span id="fw-co"><select id="fCo"></select></span>
      <span id="fw-line"><select id="fLine"></select></span>
      <span id="fw-status"><select id="fStatus"></select></span>
      <span id="fw-q"><input type="search" id="fQ" placeholder="품명·품번 검색" style="min-width:220px"></span>
    </div>
    <section id="tab-sum" class="tab hidden"></section>
    <section id="tab-rep" class="tab hidden"></section>
    <section id="tab-co" class="tab hidden"></section>
    <section id="tab-item" class="tab hidden"></section>
    <section id="tab-order" class="tab hidden"></section>
    <section id="tab-trend" class="tab hidden"></section>
    <section id="tab-recon" class="tab hidden"></section>
    <section id="tab-price" class="tab hidden"></section>
    <section id="tab-chk" class="tab hidden"></section>
    <section id="tab-master" class="tab hidden"></section>
    <section id="tab-data" class="tab hidden"></section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="hidden"></div>
<div class="tip" id="tip"></div>

<script src="lib/xlsx.full.min.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/model.js"></script>
<script src="js/excel.js"></script>
<script src="js/ui.js"></script>
<script>boot();</script>
</body>
</html>
